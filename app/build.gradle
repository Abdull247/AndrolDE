plugins {
	id 'com.android.application'
}

android {
	compileSdk 34
	
	useLibrary 'org.apache.http.legacy'
	
	defaultConfig {
		applicationId "org.ide.andriod"
		namespace "org.ide.andriod"
		minSdkVersion 21
		targetSdkVersion 29
		versionCode 1
		versionName "2.0 BETA_SNAPSHOT"
	}
	
	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}
}

dependencies {
	implementation fileTree(dir: 'libs', include: ['*.jar'])
	implementation 'androidx.appcompat:appcompat:1.7.1'
	implementation 'com.google.android.material:material:1.12.0'
	implementation 'com.google.code.gson:gson:2.11.0'
	implementation 'com.squareup.okhttp3:okhttp:4.12.0'
	implementation 'de.hdodenhof:circleimageview:3.1.0'
	implementation 'com.airbnb.android:lottie:6.5.2'
	implementation 'io.github.Rosemoe.sora-editor:editor:0.8.4'
	implementation 'io.github.Rosemoe.sora-editor:language-java:0.8.4'
	implementation 'org.eclipse.jdt:ecj:3.34.0'
	implementation 'com.android.tools:r8:8.3.37'
	implementation('com.android.tools:sdklib:25.3.0') {
		exclude group: 'com.google.guava', module: 'guava'
		exclude group: 'com.intellij', module: 'annotations'
	}
	implementation 'org.eclipse.jgit:org.eclipse.jgit:6.7.0.202309050840-r'
}
